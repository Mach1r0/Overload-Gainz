# docker-compose.prod.yml — ambiente de PRODUÇÃO
# Uso: docker compose -f docker-compose.prod.yml up -d
# Requer: .env.prod com DATABASE_URL, SECRET_KEY, etc.

services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: always
    env_file:
      - .env.prod
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-overload_gainz}
      - POSTGRES_USER=${POSTGRES_USER:-og_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-og_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  celery_worker:
    build: ./backend
    container_name: celery_worker
    restart: always
    command: celery -A core worker --loglevel=info --concurrency=4
    env_file:
      - .env.prod
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  celery_beat:
    build: ./backend
    container_name: celery_beat
    restart: always
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.prod
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    env_file:
      - .env.prod
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-og_rabbit}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: frontend
    restart: always
    command: pnpm start
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - app-network

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  app-network:
    driver: bridge
